name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (backend-free)
        run: npx playwright test e2e/public

      - name: Note skipped backend E2E
        # e2e/app/** requires E2E_TEST_EMAIL / E2E_TEST_PASSWORD secrets and a
        # Supabase-backed environment — intentionally NOT run in CI. Run
        # locally with the secrets set to exercise the per-role journeys.
        run: echo "::notice::Backend e2e (e2e/app) skipped — no E2E_TEST_* secrets configured."

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
